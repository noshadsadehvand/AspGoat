# CodeQL + SonarQube Cloud scans for AspGoat (your fork).
# Put this file in the fork at .github/workflows/scans.yml.
# CodeQL results are pushed as SARIF to the "scan-results" branch.
# The SonarQube job needs repository secret SONAR_TOKEN; without it the job is skipped.
name: Security scans
on:
  push:
    branches: [master, main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  codeql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          tools: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.2/codeql-bundle-linux64.tar.gz
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          upload: never
          output: sarif-out
      - name: Push SARIF to scan-results branch
        run: |
          f=$(ls sarif-out/*.sarif | head -1)
          cp "$f" /tmp/codeql-${{ matrix.language }}.sarif
          git config user.name scan-bot; git config user.email scan-bot@users.noreply.github.com
          for i in 1 2 3 4 5; do
            git fetch origin scan-results && git checkout -f -B scan-results origin/scan-results || git checkout -f --orphan scan-results
            git rm -rf --cached . -q || true
            cp /tmp/codeql-${{ matrix.language }}.sarif .
            git add codeql-${{ matrix.language }}.sarif
            git commit -m "CodeQL ${{ matrix.language }} SARIF" && git push origin scan-results && break
            sleep $((RANDOM % 10 + 5))
          done
  sonar:
    runs-on: ubuntu-latest
    steps:
      - name: Check token
        id: tok
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: if [ -n "$SONAR_TOKEN" ]; then echo ok=1 >> "$GITHUB_OUTPUT"; else echo "SONAR_TOKEN not set, skipping"; fi
      - uses: actions/checkout@v4
        if: steps.tok.outputs.ok == '1'
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        if: steps.tok.outputs.ok == '1'
        with:
          distribution: zulu
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        if: steps.tok.outputs.ok == '1'
        with:
          dotnet-version: '8.0.x'
      - name: Build and analyze
        if: steps.tok.outputs.ok == '1'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet-sonarscanner begin /k:"noshadsadehvand_AspGoat" /o:"noshadsadehvand" \
            /d:sonar.token="$SONAR_TOKEN" /d:sonar.host.url="https://sonarcloud.io"
          dotnet build AspGoat.csproj --configuration Release
          dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
